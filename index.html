<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Missing People Searcher</title>
</head>
<body>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('https://lomando.com/pimg/mainent1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
        }
    </style>
    <p style="color: white;">White text</p>
    <h1>Find a Missing person now:</h1>
     <form>
        <input type="text" id="firstname" placeholder="Enter a first name"><br>
          <input type="text" id="lastname" placeholder="Enter the last name to complete the missing person"><br>
        <input type="button" py-click="find_them." value="Search for your person.">
    </form>
    <div id="conclusion"></div>
    <py-script src="main.py"></py-script>
</body>
</html>
